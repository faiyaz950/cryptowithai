# Hostinger VPS (ya kisi bhi Docker server) par poora stack:
#   Caddy (80/443, auto HTTPS) ─┬─ /api/*, /health ──► backend  (uvicorn :8000)
#                               └─ baaki sab        ──► frontend (next   :3000)
#   backend ──► Postgres (user accounts, keys) + Redis (chat cache)
#
# Config repo root ki `.env` se aati hai — template: `.env.production.example`.
# Chalao: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptoandai
      POSTGRES_USER: cryptoandai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env mein set karein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoandai -d cryptoandai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cryptoandai:${POSTGRES_PASSWORD}@db:5432/cryptoandai
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL .env mein set karein}
      PUBLIC_API_URL: ${PUBLIC_URL}/api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_CRYPTO_API_URL: ${PUBLIC_URL}/api
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_MUKUL_REFERRAL_URL: ${NEXT_PUBLIC_MUKUL_REFERRAL_URL:-}
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
